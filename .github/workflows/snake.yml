name: Getsuga Tensho

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate activity graph
        run: node .github/scripts/activity-graph.mjs ${{ github.repository_owner }} dist/activity-graph.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate Getsuga Tensho animation
        run: |
          sudo apt-get install -y -qq gifsicle
          pip install -q pillow numpy
          python .github/scripts/getsuga_gif.py ${{ github.repository_owner }} dist/raw.gif
          gifsicle -O3 dist/raw.gif -o dist/ichigo-getsuga.gif
          rm dist/raw.gif
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
